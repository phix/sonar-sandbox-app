# Scan every pull request, and let the Sonar quality gate decide whether it can
# merge.
#
# This is the first and last arrow of the restated flow: it starts the loop, and
# the re-scan triggered by a remediation push is what closes it.
#
# THE JOB'S OWN CONCLUSION IS THE REQUIRED STATUS CHECK. Nothing here posts a
# separate commit status, because a second status is a second thing that can
# disagree with the first. Make `sonar-pr-scan / gate` required on main.
#
# Fork pull requests are refused, not silently skipped. GitHub withholds
# repository secrets from a `pull_request` run on a fork, so SONAR_TOKEN is
# simply absent and the scan cannot run at all — the failure is at step 1, not
# at the push. `pull_request_target` is deliberately NOT used to work around
# this: it runs in the base repo's context with secrets and a write token
# against contributor-controlled code.
name: sonar-pr-scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# A remediation push re-triggers this workflow while the previous run may still
# be polling. Superseding is correct here: only the newest head matters.
concurrency:
  group: sonar-pr-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    # The light container shape from docs/decisions/ci-container.md. The scan
    # needs no JRE of its own: sonarqube-scan-action downloads a Scanner CLI
    # that carries an embedded Java 21.
    container: node:24-bookworm

    steps:
      # FIRST, before any checkout or secret use. A fork PR must end red.
      - name: Refuse fork pull requests
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error title=Fork pull requests are out of scope::GitHub does not pass repository secrets to a pull_request run from a fork, so SONAR_TOKEN is absent and the scan cannot run. This check fails deliberately rather than reporting a green gate it never earned."
          exit 1

      - uses: actions/checkout@v5
        with:
          # Sonar needs real history for new-code attribution and blame.
          fetch-depth: 0

      # Coverage has to be measured before the scan, not after: the scanner
      # reads lcov off disk. This also means a red test suite fails the gate
      # before Sonar is ever called — deliberate, since a PR whose tests do not
      # pass has nothing worth scanning.
      - name: Install dependencies
        run: npm ci

      # The gate's own reporting path. Deliberately not part of `npm test`:
      # that runs on the raw PR head in remediate.yml, where this file does not
      # exist. Here the merge ref carries main's scripts, so it is both safe and
      # the only place the reporter is exercised before it reports.
      - name: Test the gate's reporting path
        run: npm run test:scripts

      - name: Test with coverage
        run: npm run test:coverage

      - name: Make lcov paths repo-root relative
        run: |
          node .github/scripts/normalize-lcov.mjs api/coverage/lcov.info api
          node .github/scripts/normalize-lcov.mjs web/coverage/web/lcov.info web

      - name: Scan the pull request
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.event.pull_request.head.ref }}
            -Dsonar.pullrequest.base=${{ github.event.pull_request.base.ref }}

      # continue-on-error so a red gate still gets its comment posted below.
      # The verdict is re-asserted in the final step.
      - name: Wait for the gate and render the findings
        id: gate
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: node .github/scripts/pr-gate.mjs .scannerwork/report-task.txt "${{ github.event.pull_request.number }}"

      - name: Comment on the pull request
        if: always() && steps.gate.outcome != 'skipped'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr-comment.md')) {
              core.warning('no pr-comment.md — the gate step failed before rendering one');
              return;
            }
            const body = fs.readFileSync('pr-comment.md', 'utf8');
            const marker = '<!-- sonar-pr-gate -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const existing = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number }
            );
            // Rewrite in place. One scan, one comment — a fresh comment per
            // push would bury the PR under a scan log.
            const mine = existing.find((c) => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Enforce the verdict
        if: steps.gate.outcome == 'failure'
        run: |
          echo "::error::The Sonar quality gate did not pass. This pull request stays blocked."
          exit 1

  # Deliberately a SECOND job, and deliberately not called `gate`.
  #
  # `gate` is the required status context in branch protection. Anything added
  # to it can block a merge, and settle must never be able to: it reports a
  # terminal state and optionally flags auto-merge intent, and a bug in it
  # blocking an otherwise-green PR would be a worse failure than not running.
  # `needs: gate` with `if: always()` means it observes the gate rather than
  # participating in it -- it runs on a red gate too, which is the case whose
  # message the whole settle stage exists to produce.
  #
  # This is also why settle is not a step in remediate.yml: remediation pushes,
  # the push re-triggers THIS workflow, and only here is the gate the fixed
  # code's gate rather than the one from before the fix.
  settle:
    name: settle
    needs: gate
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the automation repo
        uses: actions/checkout@v5
        with:
          repository: phix/sonar-remediation-automation
          path: .automation

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm ci --prefix .automation

      # Absent is a legitimate state: no remediation has run on this branch yet.
      # settle then reports red-undetermined naming the missing input, which is
      # the honest answer -- not a green that ignored policy refusals.
      - name: Fetch the remediation record, if remediation has run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Looked up by ARTIFACT NAME, not by branch. remediate.yml is
          # workflow_dispatch, so its run is attributed to whatever ref it was
          # dispatched from -- usually main, never the PR head -- and a
          # --branch filter would quietly find nothing and report "no
          # remediation has run" for a PR that had just been remediated. The
          # artifact name carries the PR number, which is the actual
          # discriminator.
          name="remediation-record-pr${{ github.event.pull_request.number }}"
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=5" \
            --jq '[.artifacts[] | select(.expired == false)][0].workflow_run.id // empty')
          if [ -z "$run_id" ]; then
            echo "no unexpired $name artifact; settle will report the dispositions as undetermined"
            exit 0
          fi
          echo "downloading $name from remediate run $run_id"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$name" --dir . || \
            echo "::warning title=Record could not be downloaded::run $run_id listed $name but it did not download."

      - name: Settle
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: phix
        run: |
          args=""
          [ -f dispositions.json ] && args="--dispositions dispositions.json"
          # Auto-merge is NOT passed. Off is the default and the only safe one
          # here: this workflow runs on every push with no way for a human to
          # opt in, and "nobody asked" must stay distinguishable from "asked
          # and did not get it".
          node .automation/settle/run.mjs \
            --project phix_sonar-sandbox-app \
            --pr "${{ github.event.pull_request.number }}" \
            $args --json settle.json

      # The one message the whole loop exists to produce. Tri-state, and the
      # three states are genuinely different outcomes:
      #   off (no TELEGRAM_BOT_TOKEN)  -> silent and green; nobody asked.
      #   on but unconfigured          -> notify.mjs exits 1; somebody asked and
      #                                   did not get it.
      #   on and configured            -> delivered, or a red step saying why.
      # `--enabled` is passed only when the token exists, which is what keeps
      # the first two apart. Collapsing them would let a missing credential
      # read as "notifications are turned off" forever. The chat id is
      # deliberately NOT part of the gate: token-without-chat-id means
      # somebody configured half of it, and that must surface as notify.mjs's
      # red ("TELEGRAM_CHAT_ID unset"), never as off.
      # (Teams was descoped 2026-08-31 — see notify-telegram-not-teams.md in
      # the automation repo's docs/decisions.)
      # preflight: optional-secret TELEGRAM_BOT_TOKEN
      # preflight: optional-secret TELEGRAM_CHAT_ID
      - name: Tell Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ ! -f settle.json ]; then
            echo "::warning title=No verdict to send::settle produced no settle.json, so there is nothing to notify about."
            exit 0
          fi
          verdict=$(node -e "console.log(require('./settle.json').verdict.state)")
          reason=$(node -e "console.log(require('./settle.json').verdict.reason)")
          enabled=""
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            enabled="--enabled"
          else
            echo "TELEGRAM_BOT_TOKEN is not set on this repository; notification stays off (the default)."
          fi
          node .automation/telegram/notify.mjs \
            --verdict "$verdict" --reason "$reason" $enabled \
            --repo "$GITHUB_REPOSITORY" \
            --pr "${{ github.event.pull_request.number }}" \
            --pr-url "${{ github.event.pull_request.html_url }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --json telegram.json

      - name: Post the settle verdict
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('settle-comment.md')) {
              core.warning('settle produced no report');
              return;
            }
            const body = fs.readFileSync('settle-comment.md', 'utf8');
            const marker = '<!-- sonar-settle -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const all = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = all.find((c) => c.body && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
