# Scan every pull request, and let the Sonar quality gate decide whether it can
# merge.
#
# This is the first and last arrow of the restated flow: it starts the loop, and
# the re-scan triggered by a remediation push is what closes it.
#
# THE JOB'S OWN CONCLUSION IS THE REQUIRED STATUS CHECK. Nothing here posts a
# separate commit status, because a second status is a second thing that can
# disagree with the first. Make the `gate` job's check required on main (the
# check context is the JOB name, so renaming this workflow's display name —
# it carries a presentation number — never touches branch protection).
#
# Fork pull requests are refused, not silently skipped. GitHub withholds
# repository secrets from a `pull_request` run on a fork, so SONAR_TOKEN is
# simply absent and the scan cannot run at all — the failure is at step 1, not
# at the push. `pull_request_target` is deliberately NOT used to work around
# this: it runs in the base repo's context with secrets and a write token
# against contributor-controlled code.
name: 02 - scan, gate & settle

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: >-
          PR number to scan manually. Ignored on a real pull_request trigger —
          this only feeds the resolve job when there is no pull_request event
          to read from.
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

# A remediation push re-triggers this workflow while the previous run may still
# be polling. Superseding is correct here: only the newest head matters.
concurrency:
  group: sonar-pr-scan-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  # Normalizes "which PR, on what branches" for both triggers this workflow
  # accepts. On pull_request, github.event.pull_request already has every
  # field; on workflow_dispatch there is no PR event payload at all, so this
  # fetches the same fields by number instead. Keeping this as one job (rather
  # than inlining a fallback in every step below) means the pull_request path
  # is byte-for-byte what it was before manual dispatch existed.
  resolve:
    name: resolve pr context
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      html_url: ${{ steps.pr.outputs.html_url }}
      node_id: ${{ steps.pr.outputs.node_id }}
    steps:
      - id: pr
        name: Resolve PR context
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HTML_URL: ${{ github.event.pull_request.html_url }}
          EVENT_NODE_ID: ${{ github.event.pull_request.node_id }}
          MANUAL_PR: ${{ inputs.pr }}
        run: |
          if [ -n "$EVENT_PR_NUMBER" ]; then
            echo "number=$EVENT_PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "head_ref=$EVENT_HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "base_ref=$EVENT_BASE_REF" >> "$GITHUB_OUTPUT"
            echo "head_repo=$EVENT_HEAD_REPO" >> "$GITHUB_OUTPUT"
            echo "html_url=$EVENT_HTML_URL" >> "$GITHUB_OUTPUT"
            echo "node_id=$EVENT_NODE_ID" >> "$GITHUB_OUTPUT"
          else
            gh api "repos/${{ github.repository }}/pulls/$MANUAL_PR" > pr.json
            echo "number=$(jq -r .number pr.json)" >> "$GITHUB_OUTPUT"
            echo "head_ref=$(jq -r .head.ref pr.json)" >> "$GITHUB_OUTPUT"
            echo "base_ref=$(jq -r .base.ref pr.json)" >> "$GITHUB_OUTPUT"
            echo "head_repo=$(jq -r .head.repo.full_name pr.json)" >> "$GITHUB_OUTPUT"
            echo "html_url=$(jq -r .html_url pr.json)" >> "$GITHUB_OUTPUT"
            echo "node_id=$(jq -r .node_id pr.json)" >> "$GITHUB_OUTPUT"
          fi

  gate:
    name: gate
    needs: resolve
    runs-on: ubuntu-latest
    # The light container shape from docs/decisions/ci-container.md. The scan
    # needs no JRE of its own: sonarqube-scan-action downloads a Scanner CLI
    # that carries an embedded Java 21.
    container: node:24-bookworm

    steps:
      # FIRST, before any checkout or secret use. A fork PR must end red.
      - name: Refuse fork pull requests
        if: needs.resolve.outputs.head_repo != github.repository
        run: |
          echo "::error title=Fork pull requests are out of scope::GitHub does not pass repository secrets to a pull_request run from a fork, so SONAR_TOKEN is absent and the scan cannot run. This check fails deliberately rather than reporting a green gate it never earned."
          exit 1

      - uses: actions/checkout@v5
        with:
          # Sonar needs real history for new-code attribution and blame.
          fetch-depth: 0

      # Coverage has to be measured before the scan, not after: the scanner
      # reads lcov off disk. This also means a red test suite fails the gate
      # before Sonar is ever called — deliberate, since a PR whose tests do not
      # pass has nothing worth scanning.
      - name: Install dependencies
        run: npm ci

      # The gate's own reporting path. Deliberately not part of `npm test`:
      # that runs on the raw PR head in remediate.yml, where this file does not
      # exist. Here the merge ref carries main's scripts, so it is both safe and
      # the only place the reporter is exercised before it reports.
      - name: Test the gate's reporting path
        run: npm run test:scripts

      - name: Test with coverage
        run: npm run test:coverage

      - name: Make lcov paths repo-root relative
        run: |
          node .github/scripts/normalize-lcov.mjs api/coverage/lcov.info api
          node .github/scripts/normalize-lcov.mjs web/coverage/web/lcov.info web

      - name: Scan the pull request
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.pullrequest.key=${{ needs.resolve.outputs.number }}
            -Dsonar.pullrequest.branch=${{ needs.resolve.outputs.head_ref }}
            -Dsonar.pullrequest.base=${{ needs.resolve.outputs.base_ref }}

      # continue-on-error so a red gate still gets its comment posted below.
      # The verdict is re-asserted in the final step.
      - name: Wait for the gate and render the findings
        id: gate
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: node .github/scripts/pr-gate.mjs .scannerwork/report-task.txt "${{ needs.resolve.outputs.number }}"

      - name: Comment on the pull request
        if: always() && steps.gate.outcome != 'skipped'
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr-comment.md')) {
              core.warning('no pr-comment.md — the gate step failed before rendering one');
              return;
            }
            const body = fs.readFileSync('pr-comment.md', 'utf8');
            const marker = '<!-- sonar-pr-gate -->';
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const existing = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number }
            );
            // Rewrite in place. One scan, one comment — a fresh comment per
            // push would bury the PR under a scan log.
            const mine = existing.find((c) => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Enforce the verdict
        if: steps.gate.outcome == 'failure'
        run: |
          echo "::error::The Sonar quality gate did not pass. This pull request stays blocked."
          exit 1

  # Deliberately a SECOND job, and deliberately not called `gate`.
  #
  # `gate` is the required status context in branch protection. Anything added
  # to it can block a merge, and settle must never be able to: it reports a
  # terminal state and optionally flags auto-merge intent, and a bug in it
  # blocking an otherwise-green PR would be a worse failure than not running.
  # `needs: gate` with `if: always()` means it observes the gate rather than
  # participating in it -- it runs on a red gate too, which is the case whose
  # message the whole settle stage exists to produce.
  #
  # This is also why settle is not a step in remediate.yml: remediation pushes,
  # the push re-triggers THIS workflow, and only here is the gate the fixed
  # code's gate rather than the one from before the fix.
  #
  # Factored into _settle-notify.yml so the auto-continue watcher
  # (auto-continue-watch.yml) can call the exact same settle+notify+Jira-outcome
  # logic a PR-triggered scan runs here, instead of a second implementation.
  settle:
    name: settle
    needs: [resolve, gate]
    if: always() && needs.resolve.outputs.head_repo == github.repository
    # A called reusable workflow's permissions are capped by the caller's —
    # the top-level `permissions:` above is read-only for contents, but
    # _settle-notify.yml pushes to automation-state and comments on the PR.
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/_settle-notify.yml
    with:
      sonar_project_key: phix_sonar-sandbox-app
      pr: ${{ needs.resolve.outputs.number }}
      pr_url: ${{ needs.resolve.outputs.html_url }}
      pr_node_id: ${{ needs.resolve.outputs.node_id }}
    secrets: inherit
