# The middle of the loop: fix every eligible finding on the PR branch, write one
# test per fix, build, test, and push back onto the branch.
#
# THE PUSH MUST USE SANDBOX_REPO_TOKEN, NOT GITHUB_TOKEN. A push made with
# GITHUB_TOKEN deliberately does not trigger further workflow runs — GitHub's
# loop guard — so the re-scan that closes this loop would never fire, and the
# run would look exactly like a success that did nothing.
#
# Deviations from the ticket, both deliberate:
#
#   Light container, not the ubuntu:24.04 bootstrap. That shape was chosen when
#   this job did its own re-scan and therefore needed a JRE. Under the restated
#   flow the push re-triggers sonar-pr-scan, which brings its own scanner, so
#   this job needs node and nothing else.
#
#   One commit, not one per rule group. Findings from different groups interleave
#   within a file (summary.js carries S3504, S1854 and S6582), and every edit
#   shifts the lines below it. Committing group by group would need the line
#   numbers re-derived after each commit or would silently mis-target. The push
#   is still single, which is what the PR sees; the bisect granularity is what
#   this gives up, and the commit body lists the groups instead.
name: remediate

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to remediate
        required: true
        default: '2'
      dry_run:
        description: Run everything but do not push
        type: boolean
        default: false
      jira:
        description: >-
          Also file a Jira ticket per finding group. OFF by default: remediation
          never waits for it, and the plan JSON — not Jira — is the record.
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: remediate-${{ inputs.pr }}
  cancel-in-progress: false

env:
  SONAR_PROJECT_KEY: phix_sonar-sandbox-app
  AUTOMATION_REPO: phix/sonar-remediation-automation
  ATTEMPT_CAP: '2'
  # Non-secret, and here rather than in `vars.` on purpose: an unset repository
  # variable expands to the empty string in silence, which the Jira step would
  # then report as "not configured" — a real credential problem and a forgotten
  # settings page producing the identical message. SONAR_PROJECT_KEY above is
  # pinned the same way for the same reason.
  JIRA_BASE_URL: https://1337software.atlassian.net
  JIRA_PROJECT_KEY: SONAR

jobs:
  remediate:
    runs-on: ubuntu-latest
    # NO `container:`. It was here only to pin node, and it is incompatible with
    # reaching the model endpoint. Inside a container Tailscale cannot get
    # /dev/net/tun, falls back to userspace networking, and exposes a SOCKS5
    # proxy instead of routing transparently -- and `client.mjs` calls
    # `globalThis.fetch`, which ignores HTTP_PROXY/ALL_PROXY entirely (undici
    # needs an explicit ProxyAgent). The tailnet would come up, the step would
    # go green, and the model call would still leave over normal egress and fail
    # to resolve `tinman`. On the host runner the TUN device is real and every
    # process routes transparently. setup-node keeps the version pin.
    # See docs/decisions/llm-endpoint-transport.md in the automation repo.
    steps:
      - name: Pin node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve the pull request
        id: pr
        uses: actions/github-script@v8
        with:
          script: |
            const pr = await github.rest.pulls.get({
              ...context.repo, pull_number: Number('${{ inputs.pr }}')
            });
            const d = pr.data;
            if (d.head.repo.full_name !== d.base.repo.full_name) {
              core.setFailed('Fork pull requests are out of scope. Repository secrets are withheld '
                + 'from fork runs, so this cannot work, and pull_request_target is refused because it '
                + 'would hand contributor-controlled code a write token.');
              return;
            }
            if (d.state !== 'open') { core.setFailed(`PR #${d.number} is ${d.state}.`); return; }
            core.setOutput('head', d.head.ref);
            core.setOutput('sha', d.head.sha);
            core.info(`PR #${d.number} head ${d.head.ref} @ ${d.head.sha}`);

      # Listing a secret is not proof it works. This prints only HTTP status
      # codes and a length — never the token — and turns an opaque "could not
      # read Username" three steps later into a named cause.
      - name: Prove SANDBOX_REPO_TOKEN actually authenticates
        env:
          T: ${{ secrets.SANDBOX_REPO_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::error title=SANDBOX_REPO_TOKEN is empty::The secret is not set on THIS repository. A workflow can only read secrets from the repo it runs in."
            exit 1
          fi
          echo "token length: ${#T}"
          case "$T" in
            *[[:space:]]*) echo "::warning title=Token contains whitespace::A newline or space was almost certainly included when the value was pasted." ;;
          esac
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" \
            -H 'Accept: application/vnd.github+json' https://api.github.com/repos/${{ github.repository }})
          echo "GET /repos/${{ github.repository }} -> $code"
          case "$code" in
            200) echo "token authenticates and can see this repository" ;;
            401) if [ "${{ inputs.dry_run }}" = "true" ]; then
                   echo "::warning title=Token rejected (401)::Invalid credential. Continuing because a dry run does not push."
                 else
                   echo "::error title=Token rejected (401)::The value is not a valid credential — expired, revoked, or mangled on paste."; exit 1
                 fi ;;
            403) echo "::error title=Token forbidden (403)::Authenticates, but is not permitted here."; exit 1 ;;
            404) echo "::error title=Token cannot see this repository (404)::A fine-grained PAT returns 404 for repositories outside its selected list. Check Repository access includes ${{ github.repository }}."; exit 1 ;;
            *)   echo "::error title=Unexpected status $code::"; exit 1 ;;
          esac

      - name: Check out the PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          # The credential that lets the eventual push re-trigger the scan. A
          # dry run does not push, so it falls back to GITHUB_TOKEN — which can
          # read the repository but deliberately cannot re-trigger workflows.
          token: ${{ (inputs.dry_run && github.token) || secrets.SANDBOX_REPO_TOKEN }}

      - name: Enforce the attempt cap
        run: |
          git config --global --add safe.directory "$PWD"
          attempts=$(git log --format='%an' -n 20 | awk '/^sonar-remediation-bot$/{n++; next} {exit} END{print n+0}')
          echo "consecutive bot commits on this branch: $attempts (cap ${ATTEMPT_CAP})"
          if [ "$attempts" -ge "${ATTEMPT_CAP}" ]; then
            echo "::error title=Attempt cap reached::${attempts} consecutive automated commits already sit on this branch. Remediation is not converging; escalating instead of looping."
            exit 1
          fi

      - name: Check out the automation repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.AUTOMATION_REPO }}
          path: .automation

      - name: Install
        run: |
          npm ci
          npm ci --prefix .automation

      - name: Fetch the PR findings from Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: node .automation/codemods/fetch-findings.mjs "$SONAR_PROJECT_KEY" "${{ inputs.pr }}" findings.json

      - name: Remediate
        id: remediate
        run: |
          node .automation/codemods/remediate.mjs findings.json --root . \
            --json ratio.json --dispositions dispositions.json

      # `tinman` is 192.168.1.217 -- a LAN address a GitHub-hosted runner has no
      # route to. This joins the tailnet so the name resolves. Ephemeral and
      # tagged: the node disappears when the job ends rather than accumulating
      # dead machines in the tailnet.
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Proves the route BEFORE the model call, so an unreachable endpoint is
      # reported as an unreachable endpoint rather than as a model failure.
      # These are two different problems with two different owners, and the
      # agentic client cannot tell them apart from the far side of a socket.
      - name: Prove tinman is reachable
        run: |
          if ! curl -sS -m 10 -o /dev/null -w 'GET /v1/models -> %{http_code}\n' \
               "${LLM_BASE_URL}/models"; then
            echo "::error title=tinman unreachable::The tailnet came up but ${LLM_BASE_URL} did not answer. Check that tinman is powered on, is a node on this tailnet, that tag:ci is permitted to reach it in the ACL, and that Ollama binds beyond loopback (OLLAMA_HOST=0.0.0.0:11434 on tinman itself)."
            exit 1
          fi
        env:
          LLM_BASE_URL: http://tinman:11434/v1

      # Only findings no codemod can handle reach this. It writes its fixes into
      # the tree, so the existing test/build/push steps below cover them without
      # a second push path.
      #
      # Unconfigured EXITS 1 and fails the job -- run.mjs:86 is deliberate about
      # that: "a pipeline that quietly skipped its only model-backed stage would
      # report the same green as one that ran it". It still writes
      # agentic-comment.md first, so the PR says which findings were left open
      # and why. Since LLM_BASE_URL and LLM_MODEL are pinned below, that path is
      # only reachable if this block is edited wrongly -- which is the point.
      - name: Agentic remediation
        env:
          LLM_BASE_URL: http://tinman:11434/v1
          # Pinned here rather than in `vars.`, for the same reason
          # SONAR_PROJECT_KEY and JIRA_BASE_URL above are: an unset repository
          # variable expands to the empty string in silence, and a forgotten
          # settings page would then be indistinguishable from a real
          # misconfiguration. The only model pulled on tinman.
          LLM_MODEL: qwen2.5-coder:14b
          # Not a credential. Ollama ignores bearer auth; this only satisfies
          # configFromEnv's all-three-or-nothing guard.
          LLM_API_KEY: tinman-local-unauthenticated
          SONAR_ORG: phix
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          node .automation/codemods/agentic/run.mjs findings.json --root . \
            --json agentic.json

      # AFTER remediation, never before, and its result is read by nothing
      # downstream. That ordering is the whole of "remediation does not wait for
      # Jira" — and it is only affordable because the plan JSON is the record
      # and Jira is a projection of it (spec §4.1). Had Jira been the state
      # store this step would have to run first, and could not be optional.
      #
      # Off is silent and green. On-but-unconfigured exits 1, because somebody
      # asked for tickets and did not get any, and reporting that as a skip is
      # how a pipeline claims success for work it never did.
      - name: File Jira tickets
        if: ${{ inputs.jira }}
        env:
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SONAR_ORG: phix
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          node .automation/jira/run.mjs findings.json --enabled \
            --plan plan.json --pr "${{ inputs.pr }}" \
            --pr-url "${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.pr }}" \
            --dispositions dispositions.json --json jira-run.json

      # `npm test`, not `test:coverage`. This job checks out the PR head branch
      # as it really is, and that branch predates every script main has gained
      # since it was cut — test:coverage is simply not there. Coverage is the
      # scan's business anyway: sonar-pr-scan runs on the merge ref, where
      # main's coverage config is present.
      - name: Test and build — a red suite pushes nothing
        run: |
          npm test
          npm run build

      - name: Commit and push
        id: push
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "nothing to commit"; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name  'sonar-remediation-bot'
          git config user.email 'sonar-remediation-bot@users.noreply.github.com'
          git add -A
          # Two provenances, counted separately. Sweeping model-authored edits
          # into a commit whose subject says "deterministically" would put a
          # false claim in the permanent history -- and provenance is exactly
          # what someone bisecting an agentic fix needs to see first.
          # agentic.json is absent whenever the agentic step wrote nothing.
          agentic_n=$(node -e "try{console.log(require('./agentic.json').summary.accepted)}catch{console.log(0)}")
          det_n=$(node -e "console.log(require('./ratio.json').resolvedDeterministically)")
          subject="Remediate ${det_n} findings deterministically"
          if [ "$agentic_n" -gt 0 ]; then
            subject="Remediate ${det_n} findings deterministically, ${agentic_n} agentically"
          fi
          git commit -F - <<EOF
          ${subject}

          $(node -e "const r=require('./ratio.json');console.log(JSON.stringify(r,null,1))")

          $(node -e "try{const s=require('./agentic.json').summary;console.log('Agentic: '+s.accepted+' accepted, '+s.rejected+' rejected by a gate, '+s.infraFailures+' endpoint failures, '+s.tokens+' tokens.')}catch{console.log('Agentic: did not run or produced nothing.')}")

          Generated one characterization test per applied fix. Findings refused by
          policy are left in place deliberately and keep the merge blocked.
          EOF
          git push origin HEAD:${{ steps.pr.outputs.head }}
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Report on the pull request
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue_number = Number('${{ inputs.pr }}');
            const all = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });

            // Two reports, two markers, two comments. run.mjs has always
            // written agentic-comment.md and nothing has ever posted it, so
            // the half of the run that needed a model was invisible on the PR.
            // They stay separate rather than concatenated because each is
            // upserted by its own marker: merging them would mean a run that
            // produced only one of the two would silently blank the other.
            const reports = [
              { file: 'remediation-comment.md', marker: '<!-- sonar-remediation -->' },
              { file: 'agentic-comment.md',     marker: '<!-- sonar-agentic -->' }
            ];
            let posted = 0;
            for (const { file, marker } of reports) {
              if (!fs.existsSync(file)) continue;
              const body = fs.readFileSync(file, 'utf8');
              const mine = all.find((c) => c.body && c.body.includes(marker));
              if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
              else await github.rest.issues.createComment({ owner, repo, issue_number, body });
              posted++;
            }
            if (!posted) core.warning('no report of either kind was produced');
