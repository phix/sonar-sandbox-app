# SHARED ENGINE — step 2 of path 1 (demo walkthrough), and the fix step both
# paths rely on. Run manually with a `pr` number, or let auto-continue-watch.yml
# dispatch it for you. See .github/workflows/README.md.
#
# The middle of the loop: fix every eligible finding on the PR branch, write one
# test per fix, build, test, and push back onto the branch.
#
# THE PUSH MUST USE SANDBOX_REPO_TOKEN, NOT GITHUB_TOKEN. A push made with
# GITHUB_TOKEN deliberately does not trigger further workflow runs — GitHub's
# loop guard — so the re-scan that closes this loop would never fire, and the
# run would look exactly like a success that did nothing.
#
# Deviations from the ticket, both deliberate:
#
#   Light container, not the ubuntu:24.04 bootstrap. That shape was chosen when
#   this job did its own re-scan and therefore needed a JRE. Under the restated
#   flow the push re-triggers sonar-pr-scan, which brings its own scanner, so
#   this job needs node and nothing else.
#
#   One commit, not one per rule group. Findings from different groups interleave
#   within a file (summary.js carries S3504, S1854 and S6582), and every edit
#   shifts the lines below it. Committing group by group would need the line
#   numbers re-derived after each commit or would silently mis-target. The push
#   is still single, which is what the PR sees; the bisect granularity is what
#   this gives up, and the commit body lists the groups instead.
name: 05 - remediate a PR

on:
  workflow_dispatch:
    inputs:
      pr:
        description: >-
          Pull request number to remediate. Leave blank to use the open demo
          PR on demo/planted-smells — the number changes every time the demo
          PR is closed and recreated, and a stale hardcoded default already
          burned one run ("PR #2 is closed", run 33446290559).
        required: false
        default: ''
      dry_run:
        description: Run everything but do not push
        type: boolean
        default: false
      jira:
        description: >-
          Also file a Jira ticket per finding group. OFF by default: remediation
          never waits for it, and the plan JSON — not Jira — is the record.
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

env:
  SONAR_PROJECT_KEY: phix_sonar-sandbox-app
  AUTOMATION_REPO: phix/sonar-remediation-automation
  ATTEMPT_CAP: '2'
  # Non-secret, and here rather than in `vars.` on purpose: an unset repository
  # variable expands to the empty string in silence, which the Jira step would
  # then report as "not configured" — a real credential problem and a forgotten
  # settings page producing the identical message. SONAR_PROJECT_KEY above is
  # pinned the same way for the same reason.
  JIRA_BASE_URL: https://1337software.atlassian.net
  JIRA_PROJECT_KEY: SONAR

jobs:
  # Split out of `remediate` so ticketing can carry its own automation-state
  # concurrency group (see _file-ticket.yml) without colliding with
  # `remediate`'s own per-PR one below — a job can only declare one
  # `concurrency:` key, and these two are genuinely different locks.
  resolve-pr:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head: ${{ steps.pr.outputs.head }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Resolve the pull request
        id: pr
        uses: actions/github-script@v8
        with:
          script: |
            let number = Number('${{ inputs.pr }}' || 0);
            if (!number) {
              // Blank input: find the open demo PR by its head branch. There
              // is at most one — demo-create-pr refuses to open a second.
              const open = await github.rest.pulls.list({
                ...context.repo, state: 'open', head: `${context.repo.owner}:demo/planted-smells`
              });
              if (open.data.length !== 1) {
                core.setFailed(`Expected exactly one open PR on demo/planted-smells, found ${open.data.length}. `
                  + 'Run "01 - create the demo PR" first, or pass an explicit PR number.');
                return;
              }
              number = open.data[0].number;
              core.info(`no PR number given — resolved the open demo PR: #${number}`);
            }
            const pr = await github.rest.pulls.get({
              ...context.repo, pull_number: number
            });
            const d = pr.data;
            if (d.head.repo.full_name !== d.base.repo.full_name) {
              core.setFailed('Fork pull requests are out of scope. Repository secrets are withheld '
                + 'from fork runs, so this cannot work, and pull_request_target is refused because it '
                + 'would hand contributor-controlled code a write token.');
              return;
            }
            if (d.state !== 'open') { core.setFailed(`PR #${d.number} is ${d.state}.`); return; }
            core.setOutput('number', d.number);
            core.setOutput('head', d.head.ref);
            core.setOutput('sha', d.head.sha);
            core.info(`PR #${d.number} head ${d.head.ref} @ ${d.head.sha}`);

  # BEFORE remediation touches anything, not after — the ticket exists before
  # the code changes this run is about to make. See
  # docs/decisions/multi-entry-point-flow.md in the automation repo for why
  # this moved; it used to run last, off `dispositions.json`, describing work
  # that had already happened rather than announcing work about to happen.
  #
  # Still optional (`inputs.jira`, default false) and still non-blocking:
  # `remediate` below runs regardless of whether this job runs, skips, or
  # fails — see its own `if:`. "File first" changed WHEN this runs, not
  # whether remediation waits for it, which it still does not.
  ticket:
    needs: resolve-pr
    if: ${{ inputs.jira }}
    # Capped by the caller otherwise: contents is read-only above, but
    # _file-ticket.yml pushes plan.json to automation-state.
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/_file-ticket.yml
    with:
      sonar_project_key: phix_sonar-sandbox-app
      scope: ${{ needs.resolve-pr.outputs.number }}
      pr_url: https://github.com/${{ github.repository }}/pull/${{ needs.resolve-pr.outputs.number }}
    secrets: inherit

  remediate:
    needs: [resolve-pr, ticket]
    if: always() && !cancelled() && needs.resolve-pr.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      # A blank pr input collapses to one shared group — correct, since blank
      # always means the single open demo PR. Explicit numbers keep their own.
      group: remediate-${{ inputs.pr || 'demo' }}
      cancel-in-progress: false
    # NO `container:`. It was here only to pin node, and it is incompatible with
    # reaching the model endpoint. Inside a container Tailscale cannot get
    # /dev/net/tun, falls back to userspace networking, and exposes a SOCKS5
    # proxy instead of routing transparently -- and `client.mjs` calls
    # `globalThis.fetch`, which ignores HTTP_PROXY/ALL_PROXY entirely (undici
    # needs an explicit ProxyAgent). The tailnet would come up, the step would
    # go green, and the model call would still leave over normal egress and fail
    # to resolve `tinman`. On the host runner the TUN device is real and every
    # process routes transparently. setup-node keeps the version pin.
    # See docs/decisions/llm-endpoint-transport.md in the automation repo.
    steps:
      - name: Pin node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Listing a secret is not proof it works. This prints only HTTP status
      # codes and a length — never the token — and turns an opaque "could not
      # read Username" three steps later into a named cause.
      - name: Prove SANDBOX_REPO_TOKEN actually authenticates
        env:
          T: ${{ secrets.SANDBOX_REPO_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::error title=SANDBOX_REPO_TOKEN is empty::The secret is not set on THIS repository. A workflow can only read secrets from the repo it runs in."
            exit 1
          fi
          echo "token length: ${#T}"
          case "$T" in
            *[[:space:]]*) echo "::warning title=Token contains whitespace::A newline or space was almost certainly included when the value was pasted." ;;
          esac
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" \
            -H 'Accept: application/vnd.github+json' https://api.github.com/repos/${{ github.repository }})
          echo "GET /repos/${{ github.repository }} -> $code"
          case "$code" in
            200) echo "token authenticates and can see this repository" ;;
            401) if [ "${{ inputs.dry_run }}" = "true" ]; then
                   echo "::warning title=Token rejected (401)::Invalid credential. Continuing because a dry run does not push."
                 else
                   echo "::error title=Token rejected (401)::The value is not a valid credential — expired, revoked, or mangled on paste."; exit 1
                 fi ;;
            403) echo "::error title=Token forbidden (403)::Authenticates, but is not permitted here."; exit 1 ;;
            404) echo "::error title=Token cannot see this repository (404)::A fine-grained PAT returns 404 for repositories outside its selected list. Check Repository access includes ${{ github.repository }}."; exit 1 ;;
            *)   echo "::error title=Unexpected status $code::"; exit 1 ;;
          esac

      - name: Check out the PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-pr.outputs.head }}
          fetch-depth: 0
          # The credential that lets the eventual push re-trigger the scan. A
          # dry run does not push, so it falls back to GITHUB_TOKEN — which can
          # read the repository but deliberately cannot re-trigger workflows.
          token: ${{ (inputs.dry_run && github.token) || secrets.SANDBOX_REPO_TOKEN }}

      - name: Enforce the attempt cap
        run: |
          git config --global --add safe.directory "$PWD"
          attempts=$(git log --format='%an' -n 20 | awk '/^sonar-remediation-bot$/{n++; next} {exit} END{print n+0}')
          echo "consecutive bot commits on this branch: $attempts (cap ${ATTEMPT_CAP})"
          if [ "$attempts" -ge "${ATTEMPT_CAP}" ]; then
            echo "::error title=Attempt cap reached::${attempts} consecutive automated commits already sit on this branch. Remediation is not converging; escalating instead of looping."
            exit 1
          fi

      - name: Check out the automation repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.AUTOMATION_REPO }}
          path: .automation

      - name: Install
        run: |
          npm ci
          npm ci --prefix .automation

      # Confirmed live 2026-09-04 (docs/decisions/multi-entry-point-flow.md):
      # a PR-scoped Sonar query returns NOTHING for a file the PR's own diff
      # has not touched yet — indistinguishable, from the query alone, from
      # a genuinely fixed one. A freshly-opened pipeline-created group-PR is
      # exactly that case, and codemods/remediate.mjs was silently handed
      # zero findings and fixed nothing, on every step green.
      #
      # _branch-pr.yml commits `.sonar-tracking/<fingerprint>.json` with the
      # group's actual findings when it opens the branch, precisely so this
      # step has a source that does not depend on the diff already existing.
      # Prefer it when present. It is removed in the same commit as a real
      # fix attempt below, so a SECOND run on the same branch finds no
      # ledger file and correctly falls back to a live PR-scoped fetch —
      # right at that point, since the file is now actually part of the diff.
      - name: Fetch the PR findings from Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if node .automation/codemods/tracked-findings.mjs findings.json; then
            echo "used the tracking ledger — this branch has not touched its flagged file(s) yet"
          else
            node .automation/codemods/fetch-findings.mjs "$SONAR_PROJECT_KEY" "${{ needs.resolve-pr.outputs.number }}" findings.json
          fi

      - name: Remediate
        id: remediate
        run: |
          node .automation/codemods/remediate.mjs findings.json --root . \
            --json ratio.json --dispositions dispositions.json

      # `tinman` is 192.168.1.217 -- a LAN address a GitHub-hosted runner has no
      # route to. This joins the tailnet so the name resolves. Ephemeral and
      # tagged: the node disappears when the job ends rather than accumulating
      # dead machines in the tailnet.
      # THE AGENTIC PATH IS OPTIONAL NOW (Nick, 2026-09-25: tinman "isn't part
      # of this anymore"). An endpoint that does not answer no longer kills the
      # run. The codemod fixes are already applied by the time execution gets
      # here, and the suite, the container gate and the push are all independent
      # of the model — so failing here used to take every one of those down with
      # it, and a retired endpoint meant the pipeline could not remediate at
      # all, codemod-only or otherwise.
      #
      # OPTIONAL MUST NOT MEAN SILENT. The findings that needed the model are
      # NAMED as not attempted, in the PR report the step below writes — the
      # same discipline as a policy refusal, which is also named rather than
      # quietly dropped. A codemod-only pass must never be mistakable for an
      # exhaustive one, and the verdict on the PR is still whatever the re-scan
      # says, so a green job here is not a green gate.
      - name: Join the tailnet
        continue-on-error: true
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # ONE decision point for "can we reach the model", and it never fails the
      # job. It carries both diagnoses that used to be separate hard steps,
      # because each is worth naming when the answer is no:
      #
      # - tailscale/github-action reports outcome=success after exhausting ALL
      #   its retries. Run 33342014303 failed `tailscale up` five times with
      #   "backend error: invalid key: unable to validate API key" and the step
      #   still went green — so the tailnet is asserted here, not believed.
      # - The tailnet IP, not the name `tinman`. Run 33341811392 died in 16ms on
      #   `curl: (6) Could not resolve host: tinman`: the action brings the node
      #   up with `--accept-routes` and never `--accept-dns`, so MagicDNS does
      #   not apply on an ephemeral runner. A tailnet IP needs no resolver.
      - name: Check whether the agentic endpoint is reachable
        id: tinman
        continue-on-error: true
        env:
          LLM_BASE_URL: http://100.102.1.50:11434/v1
        run: |
          state=$(tailscale status --json 2>/dev/null | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              try{console.log(JSON.parse(s).BackendState||'NoState')}catch{console.log('Unreadable')}})")
          echo "tailscale BackendState: $state"

          if [ "$state" != "Running" ]; then
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Tailnet did not come up::tailscale up did not connect (BackendState=$state) even though tailscale/github-action reported success. Check the OAuth client: it needs the auth_keys scope AND must carry tag:ci, and tag:ci must exist in tagOwners. 'invalid key: unable to validate API key' means the credential was rejected, not that the ACL blocked anything. Carrying on codemod-only."
            exit 0
          fi
          tailscale status | sed -n '1,20p'

          if curl -sS -m 10 -o /dev/null -w 'GET /v1/models -> %{http_code}\n' \
               "${LLM_BASE_URL}/models"; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=agentic endpoint unreachable::The tailnet came up but ${LLM_BASE_URL} did not answer. Check that tinman is powered on, that tag:ci is permitted to reach it in the ACL, that its tailnet IP has not changed, and that Ollama binds beyond loopback (OLLAMA_HOST=0.0.0.0:11434 on tinman itself). Carrying on codemod-only; the findings that needed the model are named in the PR report."
          fi

      # Only findings no codemod can handle reach this. It writes its fixes into
      # the tree, so the existing test/build/push steps below cover them without
      # a second push path.
      #
      # Runs only when the endpoint answered. Unconfigured still EXITS 1 and
      # fails the job -- run.mjs:86 is deliberate about that: "a pipeline that
      # quietly skipped its only model-backed stage would report the same green
      # as one that ran it". That guard stays; what changed is that an
      # unreachable endpoint is now caught before the call, named, and skipped,
      # rather than taking the whole pass down with it.
      - name: Agentic remediation
        if: steps.tinman.outputs.reachable == 'true'
        # A hard ceiling, independent of any budget arithmetic inside the tool.
        # With headerTimeoutMs at 180s the nested retries multiply: findings x
        # proposal attempts x LLM attempts x 180s reached THREE HOURS at ten
        # findings, and run 33344250098 was still going after 30 minutes. The
        # cap below fixes the arithmetic; this makes a future miscalculation
        # fail loudly instead of running until someone notices.
        #
        # 45, from the measurement rather than a guess: CI calls run ~5.5min
        # each (run 33402238999), and 2 findings x 3 attempts is ~33 minutes
        # worst case, plus setup.
        timeout-minutes: 45
        env:
          LLM_BASE_URL: http://100.102.1.50:11434/v1
          # Pinned here rather than in `vars.`, for the same reason
          # SONAR_PROJECT_KEY and JIRA_BASE_URL above are: an unset repository
          # variable expands to the empty string in silence, and a forgotten
          # settings page would then be indistinguishable from a real
          # misconfiguration.
          #
          # sonarfix:latest is a ROLE tag on tinman, and this line is a
          # contract, not a model choice: the tag always names whatever model,
          # quant, context window and output cap currently survive tinman's
          # ~8GB of genuinely usable VRAM AND the acceptance gates. Model
          # quirks live in the tag too (the resident qwen3:8b has its
          # thinking mode forced off by a patched template, because /v1 sends
          # reasoning to a field this pipeline never reads and an empty
          # `content` comes back otherwise). Re-baking the tag is an
          # ollama-side edit and deliberately NOT a workflow PR.
          #
          # As of 2026-08-31: qwen3:8b, num_ctx 8192, num_predict 2560.
          # The elimination that got here (identical 5k-prompt probes, and
          # dry runs 33432556554 / 33437464397 / 33440267614):
          #   14b q4  spills at rest         2.9 tok/s   8-min attempts
          #   14b q3  spills at depth only   3.2 tok/s   45-min step timeout
          #   7b      fits, 91 tok/s         but wrong test expectations, 0 accepted
          #   qwen3:8b fits, 64 tok/s        summary.js:39 ACCEPTED, step in 3m08s
          # The full saga: docs/decisions/llm-endpoint-transport.md in the
          # automation repo. Ollama's "100% GPU" claim is not evidence of
          # fitting -- it counts its own allocation, not what Windows holds
          # on the card; only a deep-context probe tells the truth.
          LLM_MODEL: sonarfix:latest
          # Not a credential. Ollama ignores bearer auth; this only satisfies
          # configFromEnv's all-three-or-nothing guard.
          LLM_API_KEY: tinman-local-unauthenticated
          SONAR_ORG: phix
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # A demo budget, not a correctness knob. Each finding is a full
          # generate-and-verify round trip against a self-hosted 14B -- minutes
          # each -- so ten of them is a coffee break and two still shows the
          # entire mechanism. Deferred findings are named in the PR report, so
          # a capped run never reads like an exhaustive one.
          # Two attempts, not three. The one informed retry is still where
          # convergence lives (temperature 0 makes attempt 1 identical every
          # run, and summary.js:39 was ACCEPTED on attempt 2 in runs
          # 33428191561 and 33432556554 once the 8k context stopped truncating
          # the retry). But attempt 3 has never once earned its cost: every
          # observed acceptance came on attempt 1 or 2, and every third
          # attempt reproduced the second's rejection verbatim.
          node .automation/codemods/agentic/run.mjs findings.json --root . \
            --max-findings 2 --max-attempts 2 --json agentic.json

      # The half that makes "optional" honest. When the endpoint did not answer,
      # the findings that needed the model are NAMED here, in the same
      # `<!-- sonar-agentic -->` comment the report step already upserts — so a
      # codemod-only pass says out loud what it did not do, and cannot be read as
      # an exhaustive one. Writing the report file rather than a fresh comment is
      # deliberate: one marker, one comment, whichever path produced it.
      - name: Name the findings an unreachable endpoint left unattempted
        if: steps.tinman.outputs.reachable != 'true'
        run: |
          node -e "
            const fs = require('fs');
            let needs = [];
            try { needs = require('./dispositions.json').needsAgent || []; } catch { /* no record */ }
            const l = ['<!-- sonar-agentic -->', '### Agentic path: NOT RUN', ''];
            l.push('The model endpoint did not answer, so the findings below were **not attempted**.');
            l.push('Everything else in this pass ran normally: codemods, the test suite, the container gate.');
            l.push('');
            if (needs.length) for (const f of needs) l.push('- \`' + f.rule + '\` at \`' + f.file + ':' + f.line + '\`');
            else l.push('No finding in this pass needed the model.');
            l.push('');
            l.push('These are not failures. They are work the endpoint was not there to do, named so that a codemod-only pass is never mistaken for a complete one.');
            fs.writeFileSync('agentic-comment.md', l.join('\n'));
            console.log('named ' + needs.length + ' finding(s) left unattempted');
          "

      # `if: always()` is load-bearing, not belt-and-braces: any earlier failure
      # must not also hide whether the code that WAS changed is sound. Proven by
      # run 36090501802 (2026-09-25), when a hard tinman failure skipped both
      # this step and the container gate below rather than attempting them — one
      # outage, two unrelated consequences, and the second one silent. The
      # endpoint no longer fails the job, but the attempt cap, the codemod step
      # and the checkout still can, and the same argument holds for each of
      # them. A gate an earlier unrelated failure can skip is not a gate.
      #
      # `npm test`, not `test:coverage`. This job checks out the PR head branch
      # as it really is, and that branch predates every script main has gained
      # since it was cut — test:coverage is simply not there. Coverage is the
      # scan's business anyway: sonar-pr-scan runs on the merge ref, where
      # main's coverage config is present.
      - name: Test and build — a red suite pushes nothing
        if: always()
        run: |
          npm test
          npm run build

      # The app has to BOOT, which is the one thing the suite above cannot
      # check: the api tests drive Express in-process through supertest and
      # never execute src/server.js or bind a port. Builds the image, runs it,
      # and requires /health and /api/orders to answer.
      #
      # THE DOCKERFILE IS BORROWED FROM main WHEN THIS BRANCH HAS NONE, and that
      # is not a nicety. The demo branch is cut from v0-pristine, which predates
      # the Dockerfile landing on main, so `docker build .` found nothing to
      # read — proven by run 36090744175 (2026-09-25), where the gate ran for
      # the first time and failed with "failed to read dockerfile: open
      # Dockerfile: no such file or directory". It is the same trap the
      # coverage comment above documents for test:coverage, and the same answer
      # applies: the Dockerfile is pipeline infrastructure rather than target
      # code, so take main's copy instead of teaching the demo baseline about
      # it. Moving v0-pristine is not an option — that tag is the catalogue's
      # oracle.
      #
      # The borrowed files are removed afterwards, so the commit step sees the
      # branch exactly as it is: a gate must not add a file to the diff this PR
      # is not about.
      #
      # A gate on the PUSH only. It is NOT proof that any finding is fixed —
      # that is Sonar's re-scan to say, after the push, not this step's to
      # assume (sonar-remediation-automation docs/decisions/container-gate.md).
      - name: Container gate — the built app must boot and serve
        if: always()
        run: |
          borrowed=0
          if [ ! -f Dockerfile ]; then
            if ! git cat-file -e origin/main:Dockerfile 2>/dev/null; then
              echo "::error title=no Dockerfile::neither this branch nor main carries a Dockerfile, so the app image cannot be built."
              exit 1
            fi
            borrowed=1
            echo "this branch has no Dockerfile (it predates main's); borrowing main's"
            git show origin/main:Dockerfile > Dockerfile
            if git cat-file -e origin/main:.dockerignore 2>/dev/null; then
              git show origin/main:.dockerignore > .dockerignore
            fi
          fi

          # `set +e` around the gate so the borrow is undone whatever it
          # decides — an early exit here would leave a Dockerfile on the demo
          # branch and put it in the very diff the demo exists to show.
          set +e
          node .automation/verify/container.mjs --root . \
            --tag sonar-sandbox-app:gate --json container-gate.json
          rc=$?
          set -e

          if [ "$borrowed" = "1" ]; then rm -f Dockerfile .dockerignore; fi
          exit "$rc"

      - name: Commit and push
        id: push
        if: ${{ !inputs.dry_run }}
        run: |
          # Every one of these is scratch this job itself writes into the
          # checkout root (findings.json by the fetch step above, the rest
          # by codemods/remediate.mjs and the agentic run) — never meant to
          # reach the branch. Confirmed live 2026-09-04
          # (docs/decisions/multi-entry-point-flow.md): with the fix above
          # this list is what stops a genuinely no-op remediation (nothing
          # to fix, so none of these differ from a real fix's output) from
          # being reported as "nothing to commit" and then committing them
          # anyway — the untracked scratch was ALWAYS enough to make
          # `git status --porcelain` non-empty, so this guard could not
          # actually fire until it excluded them by name.
          # `.automation` is the automation-repo checkout this job makes into
          # the worktree, and it is scratch like the rest — but it is a NESTED
          # GIT REPOSITORY, so `git add -A` does not add its files, it adds a
          # gitlink ("Subproject commit <sha>") and silently turns the sandbox
          # into a repo with an embedded repo in it. Proven 2026-09-25: the
          # first real remediation run (e1d2eb4) committed exactly that, the
          # first time in the branch's history, putting a meaningless
          # `160000 commit` entry in the very diff the demo exists to show.
          # Excluding it by pathspec is right for the demo branch specifically,
          # because that branch is cut from v0-pristine and will never carry a
          # .gitignore fix made on main.
          SCRATCH=(findings.json ratio.json dispositions.json agentic.json
                    remediation-comment.md agentic-comment.md
                    container-gate.json container-gate-comment.md
                    .automation)
          EXCLUDE=()
          for f in "${SCRATCH[@]}"; do EXCLUDE+=(":(exclude)$f"); done

          if git diff --quiet -- . "${EXCLUDE[@]}" \
             && git diff --cached --quiet -- . "${EXCLUDE[@]}" \
             && [ -z "$(git status --porcelain -- . "${EXCLUDE[@]}")" ]; then
            echo "nothing to commit"; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name  'sonar-remediation-bot'
          git config user.email 'sonar-remediation-bot@users.noreply.github.com'
          # The open-ledger marker _branch-pr.yml committed when this branch
          # was created (docs/decisions/multi-entry-point-flow.md). Removed
          # here, in the SAME commit as the real fix, rather than waiting for
          # the settle stage to confirm the fix worked — waiting would need
          # an extra bot push just to delete one file, re-triggering a whole
          # scan cycle for a purely cosmetic cleanup. A no-op run never
          # reaches this line (the guard above just returned), so an
          # attempt that fixed nothing correctly leaves the ledger open.
          # Harmless when this PR was not pipeline-created (the demo PR,
          # remediate-pr's batch case): the glob matches nothing and `-f`
          # is silent about that.
          rm -f .sonar-tracking/*.json
          git add -A -- . "${EXCLUDE[@]}"
          # Two provenances, counted separately. Sweeping model-authored edits
          # into a commit whose subject says "deterministically" would put a
          # false claim in the permanent history -- and provenance is exactly
          # what someone bisecting an agentic fix needs to see first.
          # agentic.json is absent whenever the agentic step wrote nothing.
          agentic_n=$(node -e "try{console.log(require('./agentic.json').summary.accepted)}catch{console.log(0)}")
          det_n=$(node -e "console.log(require('./ratio.json').resolvedDeterministically)")
          subject="Remediate ${det_n} findings deterministically"
          if [ "$agentic_n" -gt 0 ]; then
            subject="Remediate ${det_n} findings deterministically, ${agentic_n} agentically"
          fi
          git commit -F - <<EOF
          ${subject}

          $(node -e "const r=require('./ratio.json');console.log(JSON.stringify(r,null,1))")

          $(node -e "try{const s=require('./agentic.json').summary;console.log('Agentic: '+s.accepted+' accepted, '+s.rejected+' rejected by a gate, '+s.infraFailures+' endpoint failures, '+s.tokens+' tokens.')}catch{console.log('Agentic: did not run or produced nothing.')}")

          Generated one characterization test per applied fix. Findings refused by
          policy are left in place deliberately and keep the merge blocked.
          EOF
          git push origin HEAD:${{ needs.resolve-pr.outputs.head }}
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # dispositionSummary() is the input settle/classify.mjs needs to say
      # whether policy refusals are outstanding, and settle cannot run in this
      # job: remediation PUSHES, the push re-triggers sonar-pr-scan, and only
      # then does a fresh gate exist. Reading the gate here would read the one
      # from before the fix. So the record crosses the workflow boundary as an
      # artifact rather than being recomputed or, worse, assumed clean.
      #
      # Not committed to the branch instead: demo-reset.yml restores this branch
      # to v0-pristine, and generated files committed onto it become noise in
      # the very diff the demo exists to show.
      #
      # AND NOT ON A DRY RUN. A dry run remediated nothing and pushed nothing,
      # so it has no record to hand over — and uploading one anyway is worse
      # than merely useless. settle finds a `dispositions.json`, concludes a
      # remediation was attempted, and records an outcome for every finding it
      # can see. Proven 2026-09-25: two dry runs left `remediation-record-pr10`
      # behind, and the next settle pass wrote 32 `not-remediated` comments and
      # tags onto real Sonar findings for a PR nobody had remediated.
      # `settle/outcome.mjs` refuses to record an outcome without a record; this
      # is what stops a record existing that was never earned.
      - name: Upload the remediation record for the settle stage
        if: ${{ always() && !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: remediation-record-pr${{ needs.resolve-pr.outputs.number }}
          path: |
            dispositions.json
            ratio.json
            agentic.json
            # The findings as remediation saw them, BEFORE the fixes. Settle's
            # outcome write-back needs these Sonar issue keys for exactly the
            # groups the push fixed: once a fix lands, the finding is gone from
            # the fresh scan, and this is then the only record of its address.
            findings.json
            container-gate.json
          if-no-files-found: warn
          retention-days: 7

      - name: Report on the pull request
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue_number = Number('${{ needs.resolve-pr.outputs.number }}');
            const all = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });

            // Two reports, two markers, two comments. run.mjs has always
            // written agentic-comment.md and nothing has ever posted it, so
            // the half of the run that needed a model was invisible on the PR.
            // They stay separate rather than concatenated because each is
            // upserted by its own marker: merging them would mean a run that
            // produced only one of the two would silently blank the other.
            // A DRY RUN MUST NOT READ LIKE A REAL ONE. These comments are
            // upserted, so a rehearsal's body would otherwise sit on the PR
            // looking exactly like a pass that pushed — and a rehearsal on the
            // demo PR is a normal thing to do. Labelled rather than suppressed:
            // the report is the only place the named agentic skip appears on the
            // PR, so suppressing it would hide the diagnostic the skip exists to
            // provide.
            const banner = '${{ inputs.dry_run }}' === 'true'
              ? '> **Dry run — nothing was pushed and no branch was changed.** '
                + 'This is what the pass would have reported.\n\n'
              : '';

            const reports = [
              { file: 'remediation-comment.md',  marker: '<!-- sonar-remediation -->' },
              { file: 'agentic-comment.md',      marker: '<!-- sonar-agentic -->' },
              // Posted because the gate is a new way for this run to be red,
              // and a red on the PR has to name which check said so.
              { file: 'container-gate-comment.md', marker: '<!-- sonar-container-gate -->' }
            ];
            let posted = 0;
            for (const { file, marker } of reports) {
              if (!fs.existsSync(file)) continue;
              const body = banner + fs.readFileSync(file, 'utf8');
              const mine = all.find((c) => c.body && c.body.includes(marker));
              if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
              else await github.rest.issues.createComment({ owner, repo, issue_number, body });
              posted++;
            }
            if (!posted) core.warning('no report of either kind was produced');
