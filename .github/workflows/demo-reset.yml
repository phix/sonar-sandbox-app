# PATH 1 (demo walkthrough), step 3 of 3 — run this manually to restart the
# walkthrough. See .github/workflows/README.md.
#
# Put the sandbox back to the state a demo starts from.
#
# Force-pushes demo/planted-smells to v0-pristine, which restores all 32
# planted findings and re-triggers the PR scan. The PR is deliberately NOT
# recreated: its number is what Sonar PR analysis, Jira links and the required
# status check are all keyed to, and a reset that renumbers it breaks every one
# of them silently.
#
# `scope: everything` (the default) also clears the namespace the
# finding-driven path accumulates — every `sonar/*` branch and PR, and
# plan.json — so the WHOLE pipeline is re-runnable from a known state, not just
# the demo branch. `scope: demo` is the original behaviour. The group cleanup
# deliberately leaves Jira alone: the tickets are the audit trail the demo
# exists to show, and a reset that erased them would erase the evidence.
#
# The reset is the one operation here that destroys work by design, so it is
# the one that least deserves the benefit of the doubt. Everything it restores
# or clears, it then verifies — and `dry_run: true` reports all of it without
# mutating anything, so the first live run of the group cleanup does not have
# to be the first time anyone sees what it would delete.
name: 06 - reset the demo

on:
  workflow_dispatch:
    inputs:
      scope:
        description: >-
          everything (default) resets the whole scenario — the demo branch,
          every sonar/* branch and PR, and plan.json. demo resets only the demo
          branch, which is the original behaviour.
        type: choice
        options:
          - everything
          - demo
        default: everything
      dry_run:
        description: >-
          Report every branch, PR and plan entry this would destroy, and change
          nothing at all. Run this once before the first live reset.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

env:
  DIRTY_BRANCH: demo/planted-smells
  DIRTY_TAG: v0-pristine
  CLEAN_TAG: v0-clean
  # Read in the scripts below rather than repeated as `${{ !inputs.dry_run }}`
  # in every guard, so a step added later has one obvious thing to check.
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  # The baseline is built in exactly one place, shared with 01 — see
  # _demo-baseline.yml for why it is `main + content` rather than a force-push
  # of the frozen v0-pristine tag, and for what `changed` means.
  baseline:
    uses: ./.github/workflows/_demo-baseline.yml
    with:
      dry_run: ${{ inputs.dry_run }}
    # Reusable workflows do not inherit secrets unless the caller says so — the
    # module's checkout fails with "Input required and not supplied: token"
    # without this. Same pattern as _file-ticket and _branch-pr.
    secrets: inherit

  # Everything that has to happen AFTER the branch moved, and nothing that has
  # to happen before it. Split out because the reusable workflow cannot also do
  # the v0-clean bookkeeping or dispatch the scan.
  bookkeeping:
    needs: baseline
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SANDBOX_REPO_TOKEN }}

      - name: Verify the branch landed where it should
        run: |
          git fetch -q origin "$DIRTY_BRANCH"
          actual="$(git rev-parse FETCH_HEAD)"
          [ "$actual" = "${{ needs.baseline.outputs.sha }}" ] || {
            echo "::error::branch is at $actual, expected ${{ needs.baseline.outputs.sha }}"; exit 1; }
          echo "ok: $DIRTY_BRANCH at $actual"

      # THE SCAN IS THE POINT, SO IT IS GUARANTEED RATHER THAN HOPED FOR.
      #
      # A force-push to the SHA a branch is already at moves no ref, so GitHub
      # fires no `synchronize` event and no PR scan. The branch gets restored and
      # Sonar keeps its previous view of it — which is exactly how the demo sat
      # with the code carrying all 32 smells while Sonar held every one of them
      # CLOSED, so `05` fetched nothing and the whole pipeline looked dead.
      #
      # The module reports whether the ref moved. When it did, the push already
      # fired the scan and dispatching here would just duplicate a two-minute
      # run; when it did not, this is the only thing that will.
      - name: Dispatch the scan if the push did not move the ref
        if: needs.baseline.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ secrets.SANDBOX_REPO_TOKEN }}
        run: |
          echo "the branch was already at ${{ needs.baseline.outputs.sha }}, so the push moved no ref and fired no scan."
          echo "dispatching 02 against the open demo PR so the baseline is actually analysed."
          num="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$DIRTY_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$num" ]; then
            echo "::warning title=no open demo PR::nothing to scan. Run \"01 - create the demo PR\" once."
            exit 0
          fi
          gh workflow run sonar-pr-scan.yml --repo "$GITHUB_REPOSITORY" -f pr="$num"
          echo "dispatched 02 for PR #$num"


      # This workflow never force-pushes main, so main moving FORWARD with
      # ordinary tooling commits destroys nothing — advance the tag and stay
      # quiet. What must never pass silently is main containing the planted
      # commits, which would mean the demo PR got merged: the baseline is
      # poisoned and a reset would rebuild from a dirty main.
      - name: Keep ${{ env.CLEAN_TAG }} tracking main
        run: |
          git fetch -q origin main
          head="$(git rev-parse FETCH_HEAD)"
          git fetch -q --tags --force origin
          clean="$(git rev-parse "${CLEAN_TAG}^{commit}")"
          # The content the baseline plants, from the tag that carries it. The
          # branch is built on top of main, so "main contains the planted code"
          # means main itself carries the smells.
          planted="$(git rev-parse "${DIRTY_TAG}^{commit}")"
          echo "main=$head  $CLEAN_TAG=$clean  $DIRTY_TAG=$planted"

          if [ "$head" = "$clean" ]; then
            echo "ok: main is at $CLEAN_TAG"
            exit 0
          fi

          if git merge-base --is-ancestor "$planted" "$head"; then
            echo "::error::main contains $DIRTY_TAG — the demo PR was merged, so main is no longer a clean baseline."
            echo "::error::Refusing to move $CLEAN_TAG onto a dirty main. Revert the merge on main first."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$clean" "$head"; then
            echo "::error::main is not a descendant of $CLEAN_TAG — history was rewritten. Resolve by hand."
            exit 1
          fi

          echo "main advanced past $CLEAN_TAG with ordinary commits; advancing the tag."
          git log --oneline "$clean..$head"
          # An annotated tag is a real object and needs a committer identity,
          # which a bare runner does not have.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$CLEAN_TAG" -m "The clean baseline. main returns here on reset." "$head"
          git push -q --force origin "$CLEAN_TAG"
          echo "ok: $CLEAN_TAG -> $head"

      # Rebuilt from main, so the baseline needs main to carry the scan config
      # and the tooling that reads the catalogue. A missing one here fails the
      # NEXT scan for a reason with no visible connection to this reset.
      - name: Assert main still carries what the baseline needs
        run: |
          git fetch -q origin main
          missing=0
          for path in sonar-project.properties smells/catalogue.json eslint.smells.config.mjs smells/verify-catalogue.mjs; do
            git cat-file -e "FETCH_HEAD:$path" 2>/dev/null && echo "ok: $path" || { echo "::error::missing on main: $path"; missing=1; }
          done
          exit $missing

      - name: Report the PR
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --head "$DIRTY_BRANCH" --state open \
            --json number,headRefOid --jq '.[] | "PR #\(.number) open, head \(.headRefOid[0:7])"'
        env:
          GH_TOKEN: ${{ github.token }}

  verify-findings:
    name: the planted findings are back
    needs: baseline
    # A dry run pushes nothing, so there is nothing to verify — and asserting
    # the branch had moved would fail on purpose.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: demo/planted-smells
      - run: npm ci --no-audit --no-fund
      - run: npm run smells:verify

  # The demo branch is only half the state the pipeline accumulates. The
  # finding-driven path (03/04) leaves one branch, one PR and one plan.json
  # item PER GROUP, and none of that is restored by force-pushing the demo
  # branch. Without this, "reset" returns the demo to step 0 while the next
  # bulk onboarding run still believes every group already has a ticket.
  #
  # It touches only the `sonar/` namespace this pipeline creates, and never
  # main. Deleting a branch also closes its PR, but the PR is commented and
  # closed FIRST so the reason is on the record before the ref is gone.
  clear-groups:
    name: clear the sonar/* namespace and the plan
    # `baseline`, not `bookkeeping`: this job touches the plan and the sonar/*
    # namespace and has nothing to do with the demo branch, and it MUST still run
    # on a dry run to report what it would clear. `bookkeeping` is skipped on a
    # dry run, and a skipped dependency skips its dependents.
    needs: baseline
    if: ${{ inputs.scope == 'everything' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Every job that reads or writes plan.json needs this same group; it is
    # what turns a race with a concurrently-running pipeline stage into a FIFO
    # queue. See .github/actions/state-checkout/action.yml.
    concurrency:
      group: automation-state
      cancel-in-progress: false
    steps:
      # Needed before state-checkout, which requires a normal checkout of THIS
      # repo so that `origin` exists for its ls-remote probe.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SANDBOX_REPO_TOKEN }}

      - name: Close the group pull requests
        env:
          GH_TOKEN: ${{ secrets.SANDBOX_REPO_TOKEN }}
        run: |
          set -euo pipefail
          numbers="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("sonar/")) | .number')"
          if [ -z "$numbers" ]; then
            echo "no open sonar/* pull requests"
            exit 0
          fi
          while read -r n; do
            [ -z "$n" ] && continue
            if [ "$DRY_RUN" = "true" ]; then
              echo "would close PR #$n"
              continue
            fi
            gh pr comment "$n" --repo "$GITHUB_REPOSITORY" --body \
              'Closed by the full-scenario reset (`06 - reset the demo`, `scope: everything`). Its branch and plan entry are being cleared so the pipeline can run again from a known state. Nothing here was merged and nothing was lost that a re-run will not recreate.'
            gh pr close "$n" --repo "$GITHUB_REPOSITORY"
          done <<< "$numbers"

      - name: Delete the group branches
        env:
          GH_TOKEN: ${{ secrets.SANDBOX_REPO_TOKEN }}
        run: |
          set -euo pipefail
          # `sonar/` only. A reset that guessed wider than the namespace this
          # pipeline creates would delete somebody's work.
          branches="$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" \
            --jq '.[].name | select(startswith("sonar/"))')"
          if [ -z "$branches" ]; then
            echo "no sonar/* branches"
            exit 0
          fi
          while read -r b; do
            [ -z "$b" ] && continue
            if [ "$DRY_RUN" = "true" ]; then
              echo "would delete branch $b"
              continue
            fi
            echo "deleting $b"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$b"
          done <<< "$branches"

      # The half that is easiest to forget, and the one that actually breaks
      # the next run: the branches are cosmetic, but a plan that still lists a
      # ticket per group makes bulk onboarding skip every one of them.
      #
      # Skipped entirely on a dry run, because state-checkout is not read-only:
      # it CREATES automation-state as an orphan if the branch does not exist.
      # The dry-run branch of the step below reads the plan off the remote
      # instead, so "change nothing at all" is literally true.
      - uses: ./.github/actions/state-checkout
        if: ${{ !inputs.dry_run }}
        with:
          token: ${{ secrets.SANDBOX_REPO_TOKEN }}

      - name: Empty the plan
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            if git fetch -q origin automation-state 2>/dev/null; then
              echo "plan.json currently holds:"
              git show FETCH_HEAD:plan.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{for (const i of (JSON.parse(s).items || [])) console.log('  would drop ' + i.group_fingerprint + ' ' + (i.jira_issue_key || '-') + ' (' + i.status + ')')})"
            else
              echo "no automation-state branch exists — nothing in the plan to drop"
            fi
            exit 0
          fi
          # `{"items":[]}` is exactly what state-checkout writes when it creates
          # automation-state as a fresh orphan, so this is the plan's own empty
          # state rather than a new one invented here.
          node -e "require('fs').writeFileSync('.state/plan.json', JSON.stringify({items:[]}, null, 2) + '\n')"
          echo "plan.json -> $(cat .state/plan.json | tr -d '\n')"

      - uses: ./.github/actions/state-commit
        if: ${{ !inputs.dry_run }}
        with:
          token: ${{ secrets.SANDBOX_REPO_TOKEN }}
          message: "Reset the plan: full-scenario reset from 06"

      # Verified rather than announced, for the same reason the demo branch is
      # verified above: a reset that silently did half its job reads exactly
      # like one that did all of it. Skipped on a dry run, where nothing was
      # supposed to become empty and the steps above have already printed what
      # they would have removed.
      - name: Verify the namespace and the plan are actually empty
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.SANDBOX_REPO_TOKEN }}
        run: |
          set -euo pipefail
          left="$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" \
            --jq '.[].name | select(startswith("sonar/"))' | grep -c . || true)"
          open="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("sonar/"))] | length')"
          git fetch -q origin automation-state
          items="$(git show FETCH_HEAD:plan.json | node -e \
            "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log((JSON.parse(s).items||[]).length))")"
          echo "sonar/* branches left: $left, open sonar/* PRs: $open, plan items: $items"
          if [ "$left" != "0" ] || [ "$open" != "0" ] || [ "$items" != "0" ]; then
            echo "::error::reset did not complete — branches=$left prs=$open plan_items=$items"
            exit 1
          fi
          echo "ok: the scenario is back to a state a fresh run can start from"
