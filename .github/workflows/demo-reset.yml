# Put the sandbox back to the state a demo starts from.
#
# Force-pushes demo/planted-smells to v0-pristine, which restores all 32
# planted findings and re-triggers the PR scan. The PR is deliberately NOT
# recreated: its number is what Sonar PR analysis, Jira links and the required
# status check are all keyed to, and a reset that renumbers it breaks every one
# of them silently.
#
# The reset is the one operation here that destroys work by design, so it is
# the one that least deserves the benefit of the doubt. Everything it restores,
# it then verifies.
name: demo-reset

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

env:
  DIRTY_BRANCH: demo/planted-smells
  DIRTY_TAG: v0-pristine
  CLEAN_TAG: v0-clean

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      # SANDBOX_REPO_TOKEN, not GITHUB_TOKEN, for the same reason remediate.yml
      # shouts it: the whole point of this force-push is the PR scan it
      # re-triggers, and a push made with GITHUB_TOKEN does not properly fire
      # downstream workflows. Proven by this workflow's own first live run
      # (33419774290, 2026-08-31): the scan run was created but sat at
      # `action_required` with zero jobs until a human approved it — a reset
      # that needs a click defeats a reset.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SANDBOX_REPO_TOKEN }}

      - name: Resolve the tags
        id: refs
        run: |
          dirty="$(git rev-parse "${DIRTY_TAG}^{commit}")"
          clean="$(git rev-parse "${CLEAN_TAG}^{commit}")"
          echo "dirty=$dirty" >> "$GITHUB_OUTPUT"
          echo "clean=$clean" >> "$GITHUB_OUTPUT"
          echo "dirty $DIRTY_TAG -> $dirty"
          echo "clean $CLEAN_TAG -> $clean"

      # If the defective branch is not a descendant of clean main, the PR diff
      # comes out empty and the demo silently shows nothing. This already
      # happened once during #14, so it is asserted rather than assumed.
      - name: Assert the defective tag still produces a diff
        run: |
          # An empty PR diff happens only when the defective tip is CONTAINED in
          # main. Having diverged from main is normal and fine — main moves on
          # its own whenever tooling lands.
          if git merge-base --is-ancestor "${{ steps.refs.outputs.dirty }}" "${{ steps.refs.outputs.clean }}"; then
            echo "::error::$DIRTY_TAG is contained in $CLEAN_TAG — the PR diff would be empty."
            exit 1
          fi
          echo "ok: $DIRTY_TAG carries commits main does not"

      - name: Force-push the defective branch back to ${{ env.DIRTY_TAG }}
        run: git push --force origin "${{ steps.refs.outputs.dirty }}:refs/heads/$DIRTY_BRANCH"

      - name: Verify the branch landed where it should
        run: |
          git fetch -q origin "$DIRTY_BRANCH"
          actual="$(git rev-parse FETCH_HEAD)"
          [ "$actual" = "${{ steps.refs.outputs.dirty }}" ] || {
            echo "::error::branch is at $actual, expected ${{ steps.refs.outputs.dirty }}"; exit 1; }
          echo "ok: $DIRTY_BRANCH at $actual"

      # This workflow never force-pushes main, so main moving FORWARD with
      # ordinary tooling commits destroys nothing — advance the tag and stay
      # quiet. What must never pass silently is main containing the defective
      # commits, which means PR #2 got merged: the baseline is poisoned and a
      # reset would restore a dirty main.
      - name: Keep ${{ env.CLEAN_TAG }} tracking main
        run: |
          git fetch -q origin main
          head="$(git rev-parse FETCH_HEAD)"
          clean="${{ steps.refs.outputs.clean }}"
          dirty="${{ steps.refs.outputs.dirty }}"

          if [ "$head" = "$clean" ]; then
            echo "ok: main is at $CLEAN_TAG"
            exit 0
          fi

          if git merge-base --is-ancestor "$dirty" "$head"; then
            echo "::error::main contains $DIRTY_TAG — PR #2 looks merged, so main is no longer a clean baseline."
            echo "::error::Refusing to move $CLEAN_TAG onto a dirty main. Revert the merge on main first."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$clean" "$head"; then
            echo "::error::main is not a descendant of $CLEAN_TAG — history was rewritten. Resolve by hand."
            exit 1
          fi

          echo "main advanced past $CLEAN_TAG with ordinary commits; advancing the tag."
          git log --oneline "$clean..$head"
          # An annotated tag is a real object and needs a committer identity,
          # which a bare runner does not have.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$CLEAN_TAG" -m "The clean baseline. main returns here on reset." "$head"
          git push -q --force origin "$CLEAN_TAG"
          echo "ok: $CLEAN_TAG -> $head"

      # A restored tree missing the scan config fails the NEXT scan, for a
      # reason with no visible connection to this reset.
      - name: Assert main still carries what the pipeline needs
        run: |
          git fetch -q origin main
          missing=0
          for path in sonar-project.properties smells/catalogue.json eslint.smells.config.mjs; do
            git cat-file -e "FETCH_HEAD:$path" 2>/dev/null && echo "ok: $path" || { echo "::error::missing on main: $path"; missing=1; }
          done
          exit $missing

      - name: Report the PR
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --head "$DIRTY_BRANCH" --state open \
            --json number,headRefOid --jq '.[] | "PR #\(.number) open, head \(.headRefOid[0:7])"'
        env:
          GH_TOKEN: ${{ github.token }}

  verify-findings:
    name: the planted findings are back
    needs: reset
    runs-on: ubuntu-latest
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: demo/planted-smells
      - run: npm ci --no-audit --no-fund
      - run: npm run smells:verify
