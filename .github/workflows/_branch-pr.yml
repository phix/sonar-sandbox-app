# REUSABLE MODULE — called by 03 and 04, not meant to be run directly. See
# .github/workflows/README.md.
#
# Module: create (or find) the branch and PR for ONE group. Called once per
# group — by onboard-backlog as a matrix, by track-finding for a single one —
# never for the "PR already exists" entry point, where there is nothing to
# create.
#
# Idempotent: if the branch already exists (a previous partial run got this
# far and stopped, or crashed after pushing but before opening the PR), this
# does not recreate it — it finds the existing PR and records it, the same
# "resume from wherever" property jira/resume.mjs gives every other stage.
name: _branch-pr

on:
  workflow_call:
    inputs:
      fingerprint:
        required: true
        type: string
      rule:
        required: true
        type: string
      module:
        required: true
        type: string
      severity:
        required: true
        type: string
      finding_count:
        required: true
        type: string
      jira_issue_key:
        required: true
        type: string
      sonar_project_key:
        required: true
        type: string
      base_branch:
        required: false
        type: string
        default: main
      auto_continue:
        required: false
        type: boolean
        default: false
    outputs:
      pr_number:
        value: ${{ jobs.branch-pr.outputs.pr_number }}
      branch_name:
        value: ${{ jobs.branch-pr.outputs.branch_name }}
  workflow_dispatch:
    inputs:
      fingerprint:
        required: true
        type: string
      rule:
        required: true
        type: string
      module:
        required: true
        type: string
      severity:
        required: true
        type: string
      finding_count:
        required: true
        type: string
      jira_issue_key:
        required: true
        type: string
      sonar_project_key:
        required: true
        type: string
      base_branch:
        required: false
        type: string
        default: main
      auto_continue:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automation-state
  cancel-in-progress: false

env:
  JIRA_BASE_URL: https://1337software.atlassian.net

jobs:
  branch-pr:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      branch_name: ${{ steps.branch.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SANDBOX_REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check out the automation repo
        uses: actions/checkout@v5
        with:
          repository: phix/sonar-remediation-automation
          path: .automation

      - name: Install
        run: npm ci --prefix .automation

      # A real commit, not an empty one — GitHub still needs at least one
      # commit between head and base to allow a PR, but "at least one" does
      # not have to mean content-free. `.sonar-tracking/<fingerprint>.json`
      # is the exact findings this branch exists for (file, line, message),
      # fetched fresh rather than passed through inputs so it is never stale
      # relative to what Sonar reports right now. remediate.yml's own commit
      # removes it again the moment a real fix attempt happens — the file's
      # whole life is "this branch is open and nothing has been attempted
      # yet"; a merged main never carries one.
      - name: Fetch the findings this branch is about
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          node .automation/codemods/fetch-findings.mjs "${{ inputs.sonar_project_key }}" \
            "branch:${{ inputs.base_branch }}" all-findings.json
          node .automation/jira/filter-findings.mjs all-findings.json \
            --fingerprints "${{ inputs.fingerprint }}" --out tracking-findings.json

      # Both names come from jira/naming.mjs in the automation repo, so the
      # branch and the PR title cannot disagree about the ticket number. They
      # used to be built in two different languages — bash here, JavaScript in
      # the github-script step below — with nothing making them agree.
      - name: Compute the branch and PR names
        id: names
        env:
          JIRA_KEY: ${{ inputs.jira_issue_key }}
          FINGERPRINT: ${{ inputs.fingerprint }}
        run: |
          echo "name=$(node .automation/jira/naming.mjs branch \
            --jira-key "$JIRA_KEY" --fingerprint "$FINGERPRINT")" >> "$GITHUB_OUTPUT"
          echo "legacy=$(node .automation/jira/naming.mjs branch \
            --fingerprint "$FINGERPRINT" --legacy)" >> "$GITHUB_OUTPUT"
          echo "title=$(node .automation/jira/naming.mjs title --jira-key "$JIRA_KEY" \
            --module "${{ inputs.module }}" --rule "${{ inputs.rule }}" \
            --finding-count "${{ inputs.finding_count }}" \
            --severity "${{ inputs.severity }}")" >> "$GITHUB_OUTPUT"

      # Deterministic and derived from the fingerprint alone, so a second run
      # for the same group — however it got triggered — always names the same
      # branch and finds it, rather than opening a duplicate under a fresh name.
      - name: Ensure the branch exists
        id: branch
        env:
          GH_TOKEN: ${{ secrets.SANDBOX_REPO_TOKEN }}
        run: |
          name="${{ steps.names.outputs.name }}"
          legacy="${{ steps.names.outputs.legacy }}"
          # A group ticketed BEFORE the ticket number was added to branch names
          # still owns its branch under the old name. Reusing it is the
          # difference between resuming that work and opening a second PR for
          # the same finding; a duplicate is worse than an ugly branch name.
          if git ls-remote --exit-code --heads origin "$name" >/dev/null 2>&1; then
            echo "branch $name already exists"
          elif git ls-remote --exit-code --heads origin "$legacy" >/dev/null 2>&1; then
            echo "branch $legacy already exists (pre-ticket-naming); reusing it"
            name="$legacy"
          else
            git config user.name  'sonar-remediation-bot'
            git config user.email 'sonar-remediation-bot@users.noreply.github.com'
            git checkout -q "${{ inputs.base_branch }}"
            git checkout -q -b "$name"
            mkdir -p .sonar-tracking
            node -e "
              // The FULL finding shape (key, rule, file, line, severity,
              // message, hash) — not a stripped display-only subset. This
              // file is not just an audit trail: remediate.yml reads it
              // straight back as findings.json for codemods/remediate.mjs
              // when the branch has not yet touched the flagged file, since
              // a PR-scoped Sonar fetch cannot see a pre-existing finding on
              // an untouched file (docs/decisions/multi-entry-point-flow.md).
              const findings = require('./tracking-findings.json');
              const ledger = {
                fingerprint: '${{ inputs.fingerprint }}',
                rule: '${{ inputs.rule }}',
                module: '${{ inputs.module }}',
                severity: '${{ inputs.severity }}',
                jira_issue_key: '${{ inputs.jira_issue_key }}',
                sonar_project_key: '${{ inputs.sonar_project_key }}',
                opened_at: new Date().toISOString(),
                findings
              };
              require('fs').writeFileSync('.sonar-tracking/${{ inputs.fingerprint }}.json', JSON.stringify(ledger, null, 2) + '\n');
            "
            git add .sonar-tracking/${{ inputs.fingerprint }}.json
            git commit -q -m "Track ${{ inputs.rule }} in ${{ inputs.module }} (${{ inputs.jira_issue_key }})"
            git push -q origin "$name"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Ensure the PR exists
        id: pr
        uses: actions/github-script@v8
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          TITLE: ${{ steps.names.outputs.title }}
        with:
          script: |
            const branch = process.env.BRANCH;
            const { owner, repo } = context.repo;
            const open = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${branch}` });
            if (open.data.length) {
              core.info(`PR #${open.data[0].number} already open for ${branch}`);
              core.setOutput('number', open.data[0].number);
              return;
            }
            const dashboard = `https://sonarcloud.io/project/issues?id=${encodeURIComponent('${{ inputs.sonar_project_key }}')}`
              + `&resolved=false`;
            const pr = await github.rest.pulls.create({
              owner, repo, head: branch, base: '${{ inputs.base_branch }}',
              // Built by jira/naming.mjs from the same ticket key the branch
              // name uses, so the two can never name different tickets.
              title: process.env.TITLE,
              body: [
                `Jira: ${{ env.JIRA_BASE_URL }}/browse/${{ inputs.jira_issue_key }}`,
                `Sonar: ${dashboard}`,
                '',
                `Group fingerprint: ${{ inputs.fingerprint }}`,
                '',
                'Opened by the pipeline; no fix yet. Run "05 - remediate a PR" against this PR number, '
                  + 'or it will run automatically if this group was ticketed with auto-continue.'
              ].join('\n')
            });
            core.setOutput('number', pr.data.number);

      - uses: ./.github/actions/state-checkout
        with:
          token: ${{ secrets.SANDBOX_REPO_TOKEN }}

      - name: Record the branch and PR
        run: |
          node .automation/jira/record.mjs branch --plan .state/plan.json \
            --fingerprint "${{ inputs.fingerprint }}" --name "${{ steps.branch.outputs.name }}"
          autoFlag=""
          [ "${{ inputs.auto_continue }}" = "true" ] && autoFlag="--auto-continue"
          node .automation/jira/record.mjs pr --plan .state/plan.json \
            --fingerprint "${{ inputs.fingerprint }}" --pr "${{ steps.pr.outputs.number }}" $autoFlag

      - uses: ./.github/actions/state-commit
        with:
          token: ${{ secrets.SANDBOX_REPO_TOKEN }}
          message: "Branch+PR #${{ steps.pr.outputs.number }} for ${{ inputs.fingerprint }}"
