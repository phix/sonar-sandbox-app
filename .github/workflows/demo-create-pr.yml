# PATH 1 (demo walkthrough), step 1 of 3 — run this manually to start.
# See .github/workflows/README.md for the full "which workflow do I run" map.
#
# Create the standing demo PR: a deliberately defective "order reporting,
# stats & session auth" feature diff on demo/planted-smells, carrying the
# planted findings of the smell catalogue for the remediation pipeline to work
# on. The PR it opens is titled and bodied as a demo target (do not merge) so
# nobody mistakes it for a real feature PR.
#
# Idempotent: if the PR is already open this reports it and stops, because the
# PR number is what Sonar PR analysis, Jira links and the required status check
# are keyed to. Use demo-reset to restore an existing PR's branch; use this only
# when there is no open PR at all.
name: 01 - create the demo PR
run-name: "01 - open the standing demo PR (planted smells on demo/planted-smells, do not merge)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  DIRTY_BRANCH: demo/planted-smells
  DIRTY_TAG: v0-pristine

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      # SANDBOX_REPO_TOKEN for the same reason as demo-reset and remediate:
      # the branch push and the PR-open below must fire the PR scan, and
      # events caused by GITHUB_TOKEN do not properly trigger workflows
      # (demo-reset's first live run proved it as `action_required` limbo).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SANDBOX_REPO_TOKEN }}

      - name: Stop if a PR is already open
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          num="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$DIRTY_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            echo "::notice::PR #$num is already open. Use demo-reset to restore its branch — recreating would renumber it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "number=$num" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Point the branch at ${{ env.DIRTY_TAG }}
        if: steps.existing.outputs.skip == 'false'
        run: |
          dirty="$(git rev-parse "${DIRTY_TAG}^{commit}")"
          clean="$(git rev-parse 'v0-clean^{commit}')"
          # A defective branch CONTAINED in main produces an empty PR diff and
          # GitHub refuses to open the PR at all. Caught here rather than as a
          # confusing "No commits between" error. Divergence is fine.
          if git merge-base --is-ancestor "$dirty" "$clean"; then
            echo "::error::$DIRTY_TAG is contained in v0-clean — the PR would have no diff."
            exit 1
          fi
          git push --force origin "$dirty:refs/heads/$DIRTY_BRANCH"
          echo "$DIRTY_BRANCH -> $dirty"

      - name: Open the PR
        id: open
        if: steps.existing.outputs.skip == 'false'
        env:
          # Not github.token: a PR opened by GITHUB_TOKEN would not fire the
          # scan that gives the new PR its required status check.
          GH_TOKEN: ${{ secrets.SANDBOX_REPO_TOKEN }}
        run: |
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --base main --head "$DIRTY_BRANCH" \
            --title "demo: planted-smells remediation target — order reporting, stats & session auth (do not merge)" \
            --body-file .github/demo-pr-body.md
          num="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$DIRTY_BRANCH" --state open --json number --jq '.[0].number')"
          echo "opened PR #$num"
          echo "number=$num" >> "$GITHUB_OUTPUT"

      # No native "continue to the next workflow" button exists in the Actions
      # UI, and GitHub does not support pre-filling a workflow_dispatch form
      # via URL (github.com/orgs/community/discussions/51159, still open).
      # This is the closest real substitute: the PR-open above already fired
      # "02 - scan, gate & settle" automatically (that's why this job uses
      # SANDBOX_REPO_TOKEN, not the default token — see the comment on that
      # step), so there is nothing to manually continue for the normal demo
      # flow. This summary just makes that visible without leaving the run
      # page, and puts the PR number somewhere copy-pasteable for the rare
      # case of a manual re-run of 02 or 05 against it.
      - name: Summarize
        if: always() && steps.existing.outcome == 'success'
        env:
          PR_NUMBER: ${{ steps.existing.outputs.number || steps.open.outputs.number }}
        run: |
          {
            echo "### Demo PR #$PR_NUMBER"
            echo
            echo "[View the PR](https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER)"
            echo
            echo "**02 - scan, gate & settle already started automatically** — opening this PR fires its \`pull_request\` trigger, no manual step needed."
            echo "[Watch it run](https://github.com/$GITHUB_REPOSITORY/actions/workflows/sonar-pr-scan.yml?query=branch%3A$DIRTY_BRANCH)"
            echo
            echo "PR number for a manual re-run of 02 or 05, if you ever need one (GitHub can't pre-fill the input box for you):"
            echo
            echo "\`\`\`"
            echo "$PR_NUMBER"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
