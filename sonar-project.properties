# SonarQube Cloud analysis configuration for the sandbox.
#
# The project key is created when the repo is imported into SonarQube Cloud
# (issue #10). It is not secret — the org and key are public config, and both
# are recorded in the automation repo's config/secrets.md.
sonar.projectKey=phix_sonar-sandbox-app
sonar.organization=phix

# Both modules are analysed. The path's first segment is the module_prefix the
# plan groups on, so keeping api/ and web/ as siblings is load-bearing rather
# than cosmetic.
sonar.sources=api/src,web/src
sonar.tests=api/test,web/src
sonar.test.inclusions=**/*.spec.ts,api/test/**

# Build output and dependencies are not ours to fix. The smell tooling is
# excluded deliberately: it is the oracle, and findings in the oracle would
# muddy the diff the scan gate performs against it.
sonar.exclusions=**/node_modules/**,**/dist/**,**/.angular/**,smells/**,eslint.smells.config.mjs
sonar.sourceEncoding=UTF-8
